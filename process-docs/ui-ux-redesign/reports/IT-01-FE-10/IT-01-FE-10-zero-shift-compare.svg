  <text x="36" y="260" font-size="10" fill="#7a4a00">注：+1.28px 为表后段（tail）在进入编辑态时的亚像素位移——来源是 P10 嵌套单元格编辑器度量（active cell min-width:3em / 嵌套 cm 行高），</text>
