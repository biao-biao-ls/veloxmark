appId: io.github.veloxmark.veloxmark
productName: VeloxMark
copyright: Copyright © 2026 VeloxMark contributors

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

publish:
  provider: github
  owner: biao-biao-ls
  repo: veloxmark

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  notarize: false
  artifactName: VeloxMark-Mac-${arch}-${version}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  fileAssociations:
    - ext: md
      name: Markdown Document
      role: Editor
      icon: build/icon.icns
    - ext: markdown
      name: Markdown Document
      role: Editor
      icon: build/icon.icns
    - ext: mdown
      name: Markdown Document
      role: Editor
      icon: build/icon.icns

win:
  icon: build/icon.ico
  artifactName: VeloxMark-Win-${arch}-${version}.${ext}
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  fileAssociations:
    - ext: md
      name: Markdown Document
      icon: build/icon.ico
    - ext: markdown
      name: Markdown Document
      icon: build/icon.ico
    - ext: mdown
      name: Markdown Document
      icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VeloxMark
  deleteAppDataOnUninstall: false
  artifactName: VeloxMark-Setup-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  executableName: veloxmark
  artifactName: VeloxMark-Linux-${arch}-${version}.${ext}
  synopsis: VeloxMark — a fast Markdown reader/editor with live preview
  category: Office;TextEditor;Utility
  maintainer: VeloxMark contributors <73355578+biao-biao-ls@users.noreply.github.com>
  mimeTypes:
    - text/markdown
  desktop:
    entry:
      StartupWMClass: veloxmark
  fileAssociations:
    - ext: md
      name: Markdown Document
    - ext: markdown
      name: Markdown Document
    - ext: mdown
      name: Markdown Document
  target:
    # snap is x64-only (same as marktext: arm64 ships AppImage/deb/rpm/tar.gz only)
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]
    - target: snap
      arch: [x64]
